<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - MyApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <div class="page-container">
        <nav class="navbar">
            <a href="home.html" class="navbar__logo">MyApp</a>
            <ul class="navbar__links">
                <li><a href="home.html" class="navbar__link">Home</a></li>
                <li><a href="products.html" class="navbar__link">Products</a></li>
                <li><a href="about.html" class="navbar__link">About</a></li>
                <li><a href="contact.html" class="navbar__link active">Contact</a></li>
            </ul>
            <div class="navbar__auth">
                <button class="navbar__btn" onclick="window.location.href='../index.html'">Sign In</button>
            </div>
        </nav>

        <div class="main-content">
            <div class="hero">
                <h1 class="hero__title">Get In Touch</h1>
                <p class="hero__description">We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
            </div>

            <div class="section">
                <div class="form-container">
                    <form id="contact-form" onsubmit="handleContactSubmit(event)">
                        <div class="form-group">
                            <label for="name" class="form-label">Your Name</label>
                            <input type="text" id="name" name="name" class="form-input" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="john@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" id="subject" name="subject" class="form-input" placeholder="How can we help?" required>
                        </div>
                        <div class="form-group">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" name="message" class="form-textarea" placeholder="Tell us more about your inquiry..." required></textarea>
                        </div>
                        <button type="submit" class="form-btn">Send Message</button>
                        <div id="form-message" style="margin-top: 15px; text-align: center; min-height: 20px;"></div>
                    </form>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p class="footer__text">&copy; 2025 MyApp. All rights reserved.</p>
            <div class="footer__links">
                <a href="#" class="footer__link">Privacy Policy</a>
                <a href="#" class="footer__link">Terms of Service</a>
                <a href="contact.html" class="footer__link">Contact Us</a>
            </div>
        </footer>
    </div>

    <script src="../js/navigation.js"></script>
    <script src="../js/contact.js"></script>
</body>
</html>
